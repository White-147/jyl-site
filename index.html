  <head>

    <!-- 站点图标：石墨圆角块 + 琥珀「蒋」字，由 scripts/gen_icons.py 从柳建毛草字体生成
         （与首屏名字同一套字体）。maskable 版供 Android 自适应图标使用。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicons/favicon-192.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <!-- 移动端状态栏/地址栏配色。
         只放**一个** meta：由 JS（hooks/useTheme.tsx）按实际生效的主题全权覆写。
         历史问题：曾是两个带 media="(prefers-color-scheme: …)" 的 meta + JS 覆写两者，
         手动选深色而系统是浅色时，媒体查询会挑走另一份，状态栏与页面脱色。
         这里保留初值，内联脚本在首屏前就会纠正它。 -->
    <meta name="theme-color" content="#fbf8f3" />
    <meta
      name="description"
      content="蒋宇龙 — 信息技术综合岗位。数据科学与大数据技术本科，兼具数据工程、业务系统交付与 Windows 原生桌面端工程化经验，覆盖应用开发、数据质检、ERP实施、团队协作四条线，擅长在技术与业务之间搭桥。"
    />
    <title>蒋宇龙 · 信息技术综合岗位</title>
    <!-- 头像预加载：React 挂载前即开始下载，挂载后瞬间可见（消除头像在关键路径末端的问题） -->
    <link rel="preload" as="image" href="images/avatar-blue.webp" />
    <script>
      // 主题初始化：默认自动（跟随系统深浅色），避免首屏闪烁。
      // ⚠️ 联动维护点（详见 docs/联动维护点.md 第 3 条）
      // 这里的判定逻辑必须与 src/hooks/useTheme.tsx 的一致：
      //   localStorage 键名固定 'theme'，取值集合固定 auto | light | dark；
      //   画布色 #fbf8f3 / #15120f 与 index.css 的 body 背景、useTheme 的 CANVAS 三处一致。
      // 除了切 .dark，还要同步那唯一的 theme-color meta，否则首屏地址栏会闪一下浅色。
      ;(function () {
        try {
          var t = localStorage.getItem('theme') || 'auto'
          var dark =
            t === 'dark' ||
            (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#15120f' : '#fbf8f3')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- ===== Liquid Glass 折射滤镜（顶栏用，见 src/index.css 的 .site-bar）=====
         ⚠️ 必须留在 DOM 里且**不能 display:none**，否则 filter 引用解析不到；
           `position:absolute; width:0; height:0` 是安全的隐藏方式。
         ⚠️ 只用 `feTurbulence`（生成器原语）造位移场，**不要用 `feImage`**：
           实测（Chrome 153）feImage 的 data URI 在 backdrop-filter 里根本进不来 ——
           带 `in2="map"` 与不写 `in2` 两版截图逐点完全相同，位移退化成恒等。
           kube.io 那套「透镜贴图」方案就卡在这里，本项目上一轮因此误判成"折射不可用"。
         ⚠️ 参数取"大尺度水波"而不是细密噪点：baseFrequency 横向 0.006（周期约 167px）、
           纵向 0.05（一个波段正好铺满边缘带），再对噪声做一次小半径模糊让弯折更柔。 -->
    <svg class="lg-filter-defs" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="2" seed="9" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="1.6" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="11" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- 面板用的弱档：区块主容器面积大（几百 px），位移一大就像哈哈镜，所以 scale 收到 6 -->
      <filter id="lg-refract-soft" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.004 0.008" numOctaves="2" seed="4" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2.4" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <!-- 首屏静态骨架：React 挂载前直接可见（消除 JS 加载期白屏）；
         挂载后 createRoot 替换 #root 内容，<style> 常驻 body 兜底样式过渡。

         ⚠️ 联动维护点（详见 docs/联动维护点.md 第 1 条）
         本骨架的**盒模型必须与 src/components/Hero.tsx 逐项一致**，否则交接时会跳动。
         历史上正是因为两处不一致，导致挂载瞬间 H1 下移 84px、副题横向收窄 224px。
         改动 Hero.tsx 的以下任一项时，必须同步改下面的 <style>：
           容器 max-width / 内边距 / 上下对齐方式 / 最小高度
           H1 与副题的字号（Tailwind 的 --text-* 是 clamp 值，不是固定 px）
           头像尺寸 / 各段 margin
         骨架里使用的 clamp 值抄自 src/index.css 的 @theme --text-*，改字体比例时要一起改。 -->
    <!-- ===== 首屏加载页 =====
         它承担 React 挂载前的**全部**空窗，是这一段时间里唯一可见的东西。

         ⚠️ 为什么现在敢这么做：静态 Hero 骨架已删除。以前那段时间显示的是骨架，
            而骨架只覆盖 Hero、且不认识路由 —— 用户 2026-09 的截图里，"文档区直开"
            和"主页冷启动"看到的是同一个主站 Hero 半成品，就是这个原因。
            删掉骨架、由这一层独占空窗之后，"半加载"在物理上不可能出现。

         ⚠️ 兜底策略改过（这是上一版真正的 bug）：上一版 4s 到点就**无条件放行**，
            开发服务器挂载慢时它会在 React 挂载前撤走，露出骨架 —— 也就是用户看到的
            "开屏动画走完之后依旧是首屏半加载"。现在**只有 React 真的挂载了才撤**，
            超时只换提示文案，绝不揭示一个没画完的页面。

         ⚠️ 进度必须来自真实信号，不做假进度条：
              fonts = document.fonts.ready ─┐
              paint = 连续两帧可绘         ├─ 各占 1/3
              app   = React 挂载并渲染完   ┘   ← **唯一决定放行的信号** -->
    <div id="boot" role="status" aria-live="polite" aria-label="正在加载">
      <div class="boot-stage" aria-hidden="true">
        <span class="boot-beam"></span>
        <span class="boot-core"></span>
      </div>
      <div class="boot-readout">
        <span class="boot-pct"><b id="boot-pct">0</b>%</span>
        <span class="boot-hint" id="boot-hint"></span>
      </div>
    </div>
    <style id="boot-style">
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1.5rem, 4vh, 2.75rem);
        background-color: #fbf8f3;
        transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .dark #boot {
        background-color: #15120f;
      }
      #boot.is-out {
        opacity: 0;
        pointer-events: none;
      }
      /* 一道竖向细光：上下淡出、中间最亮，靠 scaleY 呼吸而不是改高度（只动合成层） */
      .boot-stage {
        position: relative;
        width: 1px;
        height: clamp(9rem, 30vh, 17rem);
        background-image: linear-gradient(
          to bottom,
          transparent,
          rgba(120, 140, 143, 0.55) 22%,
          rgba(157, 83, 0, 0.9) 50%,
          rgba(120, 140, 143, 0.55) 78%,
          transparent
        );
        transform-origin: center;
        animation: boot-breathe 2.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .dark .boot-stage {
        background-image: linear-gradient(
          to bottom,
          transparent,
          rgba(230, 232, 233, 0.28) 22%,
          rgba(242, 169, 59, 0.95) 50%,
          rgba(230, 232, 233, 0.28) 78%,
          transparent
        );
      }
      /* 光核：细光正中一颗很小的亮斑 + 一圈光晕，缓慢上下浮 */
      .boot-core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3px;
        height: 3px;
        margin: -1.5px 0 0 -1.5px;
        border-radius: 9999px;
        background-color: #9d5300;
        box-shadow: 0 0 12px 4px rgba(217, 122, 6, 0.4);
        animation: boot-drift 2.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .dark .boot-core {
        background-color: #f2a93b;
        box-shadow: 0 0 14px 5px rgba(242, 169, 59, 0.45);
      }
      .boot-readout {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        font-family: "Victor Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.18em;
        color: rgba(71, 85, 105, 0.75);
      }
      .dark .boot-readout {
        color: rgba(203, 213, 225, 0.7);
      }
      .boot-pct b {
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      .boot-hint {
        min-height: 1em;
        font-size: 0.625rem;
        letter-spacing: 0.06em;
        opacity: 0.75;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scaleY(0.82);
          opacity: 0.7;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }
      @keyframes boot-drift {
        0%,
        100% {
          transform: translateY(-1.15rem);
        }
        50% {
          transform: translateY(1.15rem);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        .boot-pct b {
          transition-duration: 1ms;
        }
        .boot-stage,
        .boot-core {
          animation: none;
        }
      }
    </style>
    <script>
      (function () {
        var boot = document.getElementById('boot')
        if (!boot) return
        var pctEl = document.getElementById('boot-pct')
        var hintEl = document.getElementById('boot-hint')
        var state = { fonts: false, paint: false, app: false }
        var shown = 0
        var revealed = false
        function score() {
          return Math.round(((state.fonts ? 1 : 0) + (state.paint ? 1 : 0) + (state.app ? 1 : 0)) / 3 * 100)
        }
        /* 百分比平滑爬升：数字不能做 CSS 过渡，用 rAF 插值，避免 0→33→66 的跳变 */
        function tick() {
          var target = score()
          if (shown !== target) {
            shown += shown < target ? Math.max(1, Math.ceil((target - shown) / 6)) : -1
            if (shown > target) shown = target
            if (pctEl) pctEl.textContent = String(shown)
          }
          if (!revealed && state.app) reveal()
          requestAnimationFrame(tick)
        }
        function reveal() {
          revealed = true
          /* 等到 100% 再撤，让读数走到头，不半路消失 */
          var wait = function () {
            if (shown < 100) return setTimeout(wait, 60)
            boot.classList.add('is-out')
            setTimeout(function () {
              if (boot.parentNode) boot.parentNode.removeChild(boot)
            }, 460)
          }
          wait()
        }
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            state.fonts = true
          })
        } else {
          state.fonts = true
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            state.paint = true
          })
        })
        /* React 挂载完成 —— **唯一**的放行条件 */
        window.addEventListener('app:ready', function () {
          state.app = true
        })
        /* 超时只换提示，**绝不**放行：没有 app:ready 就说明页面还没画好，
           这时候撤掉加载页只会露出一个空壳（这正是上一版的 bug）。 */
        setTimeout(function () {
          if (!state.app && hintEl) hintEl.textContent = '加载较慢，请稍候…'
        }, 8000)
        setTimeout(function () {
          if (!state.app && hintEl) hintEl.textContent = '加载失败，请刷新页面'
        }, 20000)
        requestAnimationFrame(tick)
      })()
    </script>
