    <!-- 移动端状态栏/地址栏配色。
         只放**一个** meta：由 JS（hooks/useTheme.tsx）按实际生效的主题全权覆写。
         历史问题：曾是两个带 media="(prefers-color-scheme: …)" 的 meta + JS 覆写两者，
         手动选深色而系统是浅色时，媒体查询会挑走另一份，状态栏与页面脱色。
         这里保留初值，内联脚本在首屏前就会纠正它。 -->
    <meta name="theme-color" content="#fafbfb" />
    <meta
      name="description"
      content="蒋宇龙 — 信息技术综合岗位。数据科学与大数据技术本科，兼具数据工程、业务系统交付与 Windows 原生桌面端工程化经验，覆盖应用开发、数据质检、ERP实施、团队协作四条线，擅长在技术与业务之间搭桥。"
    />
    <title>蒋宇龙 · 信息技术综合岗位</title>
    <!-- 头像预加载：React 挂载前即开始下载，挂载后瞬间可见（消除头像在关键路径末端的问题） -->
    <link rel="preload" as="image" href="images/avatar-blue.webp" />
    <script>
      // 主题初始化：默认自动（跟随系统深浅色），避免首屏闪烁。
      // ⚠️ 联动维护点（详见 docs/联动维护点.md 第 3 条）
      // 这里的判定逻辑必须与 src/hooks/useTheme.tsx 的一致：
      //   localStorage 键名固定 'theme'，取值集合固定 auto | light | dark；
      //   画布色 #fafbfb / #121415 与 index.css 的 body 背景、useTheme 的 CANVAS 三处一致。
      // 除了切 .dark，还要同步那唯一的 theme-color meta，否则首屏地址栏会闪一下浅色。
      ;(function () {
        try {
          var t = localStorage.getItem('theme') || 'auto'
          var dark =
            t === 'dark' ||
            (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#121415' : '#fafbfb')
        } catch (e) {}
      })()
    </script>

         ⚠️ 联动维护点（详见 docs/联动维护点.md 第 1 条）
         本骨架的**盒模型必须与 src/components/Hero.tsx 逐项一致**，否则交接时会跳动。
         历史上正是因为两处不一致，导致挂载瞬间 H1 下移 84px、副题横向收窄 224px。
         改动 Hero.tsx 的以下任一项时，必须同步改下面的 <style>：
           容器 max-width / 内边距 / 上下对齐方式 / 最小高度
           H1 与副题的字号（Tailwind 的 --text-* 是 clamp 值，不是固定 px）
           头像尺寸 / 各段 margin
         骨架里使用的 clamp 值抄自 src/index.css 的 @theme --text-*，改字体比例时要一起改。 -->
    <style id="hero-shell-style">
      /* ===== 与 Hero.tsx 对应的设计常量 =====
         Hero.tsx 的类名 → 这里的手写 CSS（骨架必须独立生效，不能依赖外部样式表）：
           section                         → .hero-shell（无内边距，min-height 见 .hero-inner）
           .hero-viewport                  → .hero-inner
           .max-w-4xl                      → max-width: 56rem
           .hero-shell .avatar (h-16/w-16 / sm:h-24/w-24)
           .text-6xl / sm:text-7xl         → --sk-h1
           .text-2xl / sm:text-4xl         → --sk-s1
           .text-xs  / .text-sm            → --sk-s2
           .text-base                      → --sk-s4 */
      .hero-shell {
        --sk-h1: clamp(2.25rem, 1.75rem + 2.5vw, 3.75rem);
        --sk-s1: clamp(1.3125rem, 1.1875rem + 0.625vw, 1.5rem);
        --sk-ebrow: clamp(0.6875rem, 0.6563rem + 0.1563vw, 0.75rem);
        --sk-s2: clamp(0.8125rem, 0.7656rem + 0.2344vw, 0.875rem);
        --sk-s4: clamp(0.9375rem, 0.875rem + 0.3125vw, 1rem);
        --sk-gap: 0.75rem;
        --sk-card-pad: 1rem;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        color: #536c70;
        background-color: #fafbfb;
        position: relative;
      }
      @media (min-width: 640px) {
        .hero-shell {
          --sk-h1: clamp(2.5rem, 1.875rem + 3.125vw, 4.25rem);
          --sk-s1: clamp(1.75rem, 1.5rem + 1.25vw, 2.25rem);
          --sk-gap: 1.5rem;
          --sk-card-pad: 1.75rem;
        }
      }
      .dark .hero-shell {
        color: #c6ccce;
        background-color: #121415;
      }
      /* 最外层容器：对应 Hero.tsx 的 `hero-viewport mx-auto flex max-w-6xl flex-col justify-start
         px-4 pb-12 pt-10 sm:justify-center sm:px-6 sm:pb-24 sm:pt-14` + index.css 的 .hero-viewport。

         ⚠️ 骨架只负责「背景」，前景文字一律不可见（这是修复跳动的最终方案）
         为什么不再尝试对齐文字位置：
           app 在 ≥640px 用 `justify-content: center` + `min-height: max(731px, 100svh - 4rem)`。
           内容高于容器时居中退化为贴顶，于是**首项位置 = 0.706 × 容器高度** ——
           它是一个随视口高度连续变化的比例，而骨架无法用「与容器高度同源」的度量复现它：
             · 固定 px：无法覆盖所有屏幕（实测 640-1500px 高度跨度下偏差 12-818px）
             · 百分比 padding：按**宽度**解析，不是高度，反而偏出 900px+
             · grid 的 fr 轨道：只对已分配的行生效，单行自动放置时直接塌陷（实测偏 56-409px）
             · vh / svh：在无头仿真下不随视口变化，无法验证；生产环境可响应但不可回归测试
           水平方向已逐项精确对齐（x 与宽度均 0 误差），垂直方向无法收敛到 0。

         结论：让骨架**不渲染前景文字**，只保留背景层与光斑（见下方 .hero-col 的 visibility）。
         没有前景内容就没有可错位的东西，跳动从根上消失，代价是 React 挂载前的一瞬
         （实测 150-260ms）首屏只有背景。 */
      .hero-inner {
        position: relative;
        max-width: 72rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        min-height: 731px;
        /* 用 vh 而不是 svh：骨架的职责只是「第一帧就占住正确高度」，
           而 vh 在各环境下的解析都稳定。实测 svh 在骨架阶段与应用挂载后会算出不同值，
           导致首屏交接时 body 高度跳 12px（CLS 0.014）。
           应用侧仍用 svh（见 index.css 的 .hero-viewport），那是它该关心的事。 */
        min-height: max(731px, calc(100vh - 4rem));
        padding: 2.5rem 1rem 3rem;
      }
      @media (min-width: 640px) {
        .hero-inner {
          padding: 3.5rem 1.5rem 6rem;
        }
      }
      /* 内容列：对应 `max-w-4xl`（56rem）。
         visibility: hidden 而不是 display: none —— 保留占位，避免骨架自身在挂载前
         还要再发生一次「无内容→有内容」的高度变化。这里内容本来就不参与观感，
         所以隐藏它不会让任何东西消失。 */
      .hero-col {
        max-width: 56rem;
        visibility: hidden;
      }
      /* 背景层（光斑+网格）：独立于背景色，CSS 应用后 0.9s 平滑淡入，
         与外部 CSS 的全站背景无缝过渡（深色同步） */
      .hero-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        animation: demo-shell-fade 0.9s ease 0.12s forwards;
        background-image:
          radial-gradient(ellipse 55% 42% at 50% 14%, rgba(242, 169, 59, 0.1), transparent 70%),
          linear-gradient(to right, rgba(120, 140, 143, 0.1) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(120, 140, 143, 0.1) 1px, transparent 1px);
        background-size: auto, 48px 48px, 48px 48px;
      }
      .dark .hero-shell::before {
        background-image:
          radial-gradient(ellipse 55% 42% at 50% 14%, rgba(242, 169, 59, 0.12), transparent 70%),
          linear-gradient(to right, rgba(120, 140, 143, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(120, 140, 143, 0.07) 1px, transparent 1px);
      }
      @keyframes demo-shell-fade {
        to { opacity: 1; }
      }
      /* 求职徽标：对应 `inline-flex items-center gap-2 rounded-full border px-3 py-1 text-xs`
         （Hero.tsx 里 py-1 / text-xs 在所有断点一致，不要给它加响应式字号）
         字号必须用 --sk-ebrow（= text-xs）而不是 --sk-s2（= text-sm），否则整列下移 5px。 */
      .hero-shell .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        align-self: flex-start;
        padding: 0.25rem 0.75rem;
        border: 1px solid #a7f3d0;
        border-radius: 9999px;
        background: #ecfdf5;
        color: #047857;
        font-size: var(--sk-ebrow);
        line-height: 1.333;
        font-weight: 500;
      }
      .dark .hero-shell .eyebrow {
        border-color: rgba(16, 185, 129, 0.3);
        background: rgba(16, 185, 129, 0.1);
        color: #34d399;
      }
      .hero-shell .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: #10b981;
        display: inline-block;
      }
      /* 名字行：对应 `mt-6 flex items-center gap-5 sm:mt-8 sm:gap-8` */
      .hero-shell .m1 {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        margin-top: 1.5rem;
      }
      @media (min-width: 640px) {
        .hero-shell .m1 {
          gap: 2rem;
          margin-top: 2rem;
        }
      }
      /* 名字：对应 `font-handwrite text-6xl leading-[1.08] tracking-tight sm:text-7xl`
         font-weight 是 400（font-normal），不是 900 —— 历史上骨架写成 900 会触发合成加粗 */
      .hero-shell h1 {
        font-size: var(--sk-h1);
        line-height: 1.08;
        font-weight: 400;
        letter-spacing: -0.025em;
        color: #1a1c1e;
        margin: 0;
        font-family: "Liu Jian Mao Cao", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      .dark .hero-shell h1 { color: #e6e8e9; }
      /* 头像：对应 `h-16 w-16 sm:h-24 sm:w-24 rounded-full object-cover`
         注意源图是 400x560 的竖版，靠 object-fit: cover 裁成圆形 */
      .hero-shell .avatar {
        width: 4rem;
        height: 4rem;
        border-radius: 9999px;
        object-fit: cover;
        box-shadow: 0 4px 12px rgba(26, 28, 30, 0.12);
        outline: 4px solid #fbecd3;
        outline-offset: -1px;
        flex-shrink: 0;
      }
      @media (min-width: 640px) {
        .hero-shell .avatar { width: 6rem; height: 6rem; }
      }
      .dark .hero-shell .avatar { outline-color: rgba(242, 169, 59, 0.28); }
      /* 定位副题：对应 `font-display mt-3 text-2xl leading-[1.12] tracking-tight sm:mt-4 sm:text-4xl`
         font-weight 是 400（font-normal） */
      .hero-shell .s1 {
        font-size: var(--sk-s1);
        line-height: 1.12;
        font-weight: 400;
        letter-spacing: -0.025em;
        color: #9d5300;
        margin: 0.75rem 0 0;
        font-family: "Smiley Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      @media (min-width: 640px) {
        .hero-shell .s1 { margin-top: 1rem; }
      }
      .dark .hero-shell .s1 { color: #f3d9ac; }
      /* 学历 / 方向行：对应 `mt-2 text-sm font-medium` 与 `mt-1.5 text-sm font-medium sm:mt-2` */
      .hero-shell .s2,
      .hero-shell .s3 {
        font-size: var(--sk-s2);
        font-weight: 500;
        color: #536c70;
        margin: 0.5rem 0 0;
      }
      .dark .hero-shell .s2,
      .dark .hero-shell .s3 { color: #95a0a3; }
      /* 首屏短句：对应 `mt-6 text-base leading-relaxed` */
      .hero-shell .s4 {
        font-size: var(--sk-s4);
        line-height: 1.625;
        color: #3b5155;
        margin: 1.5rem 0 0;
      }
      .dark .hero-shell .s4 { color: #c6ccce; }
      /* 行动区：对应移动端 `grid grid-cols-2 gap-3`，≥640px 时 `sm:flex sm:items-center` */
      .hero-shell .cta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--sk-gap);
        margin-top: 2rem;
      }
      @media (min-width: 640px) {
        .hero-shell .cta {
          display: flex;
          align-items: center;
        }
      }
      /* 按钮：对应 `rounded-lg px-5 py-2.5 text-sm font-semibold`
         （Tailwind --spacing 为 0.25rem，故 px-5 = 1.25rem、py-2.5 = 0.625rem） */
      .hero-shell .btn-primary,
      .hero-shell .btn-ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-size: var(--sk-s2);
        font-weight: 600;
        text-decoration: none;
      }
      /* 主按钮：对应 `bg-brand-700 text-white`；hover 时 bg-brand-800 */
      .hero-shell .btn-primary { background: #9d5300; color: #fff; }
      /* 次按钮：对应 `border border-brand-300 bg-white text-brand-700` */
      .hero-shell .btn-ghost {
        border: 1px solid #f2a93b;
        background: #fff;
        color: #9d5300;
      }
      .dark .hero-shell .btn-primary { background: #9d5300; }
      .dark .hero-shell .btn-ghost {
        background: #23282b;
        color: #f3d9ac;
        border-color: rgba(242, 169, 59, 0.4);
      }
      /* 移动端按钮撑满（对应 `w-full sm:w-auto`）。
         注意移动端是**两列网格**而不是纵向堆叠，与 app 的 `grid grid-cols-2 gap-3` 一致。 */
      .hero-shell .btn-primary,
      .hero-shell .btn-ghost { width: 100%; }
      @media (min-width: 640px) {
        .hero-shell .btn-primary,
        .hero-shell .btn-ghost { width: auto; }
      }
    </style>
    <div id="root">
      <!-- 骨架的 DOM 层级与 Hero.tsx 一一对应：
             section.hero-shell            → <section>
             div.hero-inner                → <div hero-viewport mx-auto max-w-6xl …>
             div.hero-col                  → <div max-w-4xl>
           缩进层级故意保持与 app 相同，便于对照维护。 -->
      <section class="hero-shell" aria-hidden="true">
        <div class="hero-inner">
          <div class="hero-col">
            <span class="eyebrow"><span class="dot"></span>求职中 · 到岗时间可沟通</span>
            <div class="m1">
              <h1>蒋宇龙</h1>
              <img class="avatar" src="images/avatar-blue.webp" alt="" width="400" height="560" />
            </div>
            <p class="s1">信息技术综合岗位</p>
            <p class="s2">数据科学与大数据技术本科</p>
            <p class="s3">数据工程 · 业务系统交付 · Windows 原生桌面端工程化</p>
            <p class="s4">从页面到桌面的全链路交付</p>
            <div class="cta">
              <a class="btn-primary" href="resume.pdf" download>下载简历</a>
              <a class="btn-ghost" href="#projects">查看项目</a>
            </div>
          </div>
        </div>
      </section>
    </div>
    <!-- 打印拦截提示：只在 @media print 下显示（见 src/index.css 的 print 段）。
         必须放在 body 直属层、不能放进 React 应用内部——应用整体被 display:none 后
         其子孙节点无论怎么设都不会渲染。 -->
    <p class="print-blocked">
      <strong>本站内容不提供打印版式</strong>
      请下载 PDF 简历：<a href="resume.pdf">resume.pdf</a><br />
      在线浏览：github.com/White-147/jyl-site
    </p>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
